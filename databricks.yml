bundle:
  name: databricks-chatbot

variables:
  serving_endpoint_name:
    description: "Name of the model serving endpoint to be used by the app"
    default: "mas-e9098983-endpoint
"

  database_instance_name:
    description: "Base name of the Lakebase database instance"
    default: "chatbot-lakebase"

  resource_name_suffix:
    description: "Suffix for resource names (app/lakebase instance names etc). Helpful for avoiding name collisions if multiple users deploy the same app to the workspace"

resources:
  database_instances:
    # TODO (optional): Uncomment the database resource below to enable persistent chat history
    # chatbot_lakebase:
    #   name: ${var.database_instance_name}-${var.resource_name_suffix}
    #   capacity: CU_1

  apps:
    databricks_chatbot:
      name: db-chatbot-${var.resource_name_suffix}

      description: "Agentic Chat application for Foundation Models, Agent Bricks, and custom code agents"

      source_code_path: .

      # User authorization scopes required by the application
      user_api_scopes:
        - sql
        - model-serving
        - sql:restricted-query

      resources:
        - name: serving-endpoint
          description: "Databricks model serving endpoint used by the AI agent"

          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY

        # TODO (optional): Uncomment the database resource below to enable persistent chat history
        # - name: database
        #   description: "Lakebase database instance for the chat app"
        #   database:
        #     database_name: databricks_postgres
        #     instance_name: ${resources.database_instances.chatbot_lakebase.name}
        #     permission: CAN_CONNECT_AND_CREATE

        # TODO (optional): Uncomment the experiment resource below to enable feedback
        # - name: experiment
        #   description: "MLflow experiment for collecting user feedback"
        #   experiment:
        #     experiment_id: "your-experiment-id"
        #     permission: CAN_EDIT

targets:
  dev:
    mode: development
    default: true

    variables:
      resource_name_suffix: dev-${workspace.current_user.domain_friendly_name}

  staging:
    mode: production

    variables:
      resource_name_suffix: "staging"

  prod:
    mode: production

    variables:
      resource_name_suffix: "prod"